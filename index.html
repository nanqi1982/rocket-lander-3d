<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D 海上火箭回收挑战：人手操 vs AI 自动飞控 | B站AI创造公开赛</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0c4a6e;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "STHeiti", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    #gl-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud-top {
      position: fixed;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }
    .mode-card {
      background: rgba(8, 15, 30, 0.78);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(56, 189, 248, 0.75);
      border-radius: 16px;
      padding: 12px 20px;
      color: #fff;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.42);
      max-width: 520px;
    }
    .mode-header {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }
    .mode-pill {
      display: inline-block;
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 999px;
      letter-spacing: 0.4px;
    }
    .mode-pill.ai {
      background: linear-gradient(135deg, #10b981, #06b6d4);
    }
    .best-chip {
      font-size: 13px;
      font-weight: 800;
      color: #fde047;
      background: rgba(250, 204, 21, 0.14);
      border: 1px solid rgba(250, 204, 21, 0.45);
      border-radius: 999px;
      padding: 3px 10px;
    }
    .rule-line {
      font-size: 16px;
      font-weight: 800;
      color: #e0f2fe;
      line-height: 1.35;
    }
    .telemetry-strip { display: flex; gap: 10px; flex-wrap: nowrap; }
    .gauge {
      background: rgba(8, 15, 30, 0.80);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(56, 189, 248, 0.65);
      border-radius: 16px;
      padding: 10px 18px;
      min-width: 146px;
      text-align: center;
      color: #fff;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.42);
    }
    .gauge-lbl { font-size: 13px; font-weight: 800; color: #93c5fd; margin-bottom: 3px; }
    .gauge-val {
      font-size: 34px;
      font-weight: 900;
      line-height: 1.05;
      font-family: "SF Mono", "JetBrains Mono", monospace;
    }
    .val-safe { color: #4ade80; }
    .val-warn { color: #facc15; }
    .val-danger { color: #f87171; }

    .result-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -56%) scale(0.8);
      opacity: 0;
      padding: 18px 28px;
      border-radius: 22px;
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 0.5px;
      color: #fff;
      border: 3px solid #fff;
      box-shadow: 0 22px 64px rgba(0, 0, 0, 0.62);
      transition: all 0.25s cubic-bezier(0.2, 1.35, 0.4, 1);
      z-index: 25;
      pointer-events: none;
      text-align: center;
      max-width: min(92vw, 680px);
    }
    .result-banner.show {
      opacity: 1;
      transform: translate(-50%, -54%) scale(1);
      pointer-events: auto;
    }
    .result-banner.crash { background: linear-gradient(135deg, rgba(185, 28, 28, 0.94), rgba(234, 88, 12, 0.94)); border-color: #fef08a; }
    .result-banner.win { background: linear-gradient(135deg, rgba(4, 120, 87, 0.95), rgba(16, 185, 129, 0.95)); border-color: #fde047; }
    .result-sub { font-size: 18px; font-weight: 800; margin-top: 8px; color: #fef9c3; line-height: 1.4; }
    .score-poster-wrap {
      margin: 12px auto 0;
      max-width: 440px;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(254, 240, 138, 0.78);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
      background: #0f172a;
      display: none;
    }
    .score-poster-wrap.ready { display: block; }
    .score-poster-img {
      display: block;
      width: 100%;
      height: auto;
      cursor: pointer;
    }
    .score-poster-tip {
      font-size: 12px;
      font-weight: 700;
      color: #fde68a;
      background: rgba(15, 23, 42, 0.88);
      padding: 5px 10px;
    }
    .result-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .res-btn {
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      padding: 9px 15px;
      font-size: 14px;
      font-weight: 900;
      color: #fff;
      background: rgba(15, 23, 42, 0.58);
      cursor: pointer;
      transition: transform 0.12s, background 0.15s;
    }
    .res-btn:hover { background: rgba(15, 23, 42, 0.88); transform: translateY(-1px); }
    .res-btn.primary { background: #facc15; color: #0f172a; border-color: #fef08a; }
    .res-btn.primary:hover { background: #fde047; }
    .res-btn.bili { background: linear-gradient(135deg, #fb7299, #f43f5e); color: #fff; border-color: #fecdd3; }
    .res-btn.bili:hover { filter: brightness(1.08); }

    .controls-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      background: rgba(8, 15, 30, 0.84);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(56, 189, 248, 0.6);
      border-radius: 20px;
      padding: 10px 16px;
      z-index: 15;
      max-width: calc(100vw - 24px);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
    }
    .ctl-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .ctl-btn {
      border: 2px solid rgba(255, 255, 255, 0.32);
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      background: #1e293b;
      cursor: pointer;
      white-space: nowrap;
      touch-action: none;
      transition: transform 0.08s, background 0.15s, border-color 0.15s;
    }
    .ctl-btn:hover { background: #2563eb; }
    .ctl-btn:active, .ctl-btn.pressed { transform: scale(0.95); border-color: #fde047; }
    .ctl-btn.active { background: #10b981; border-color: #fde047; }
    .ctl-btn.fire {
      background: linear-gradient(135deg, #f97316, #ef4444);
      border-color: rgba(254, 240, 138, 0.65);
      min-width: 158px;
    }
    .ctl-btn.fire.pressed {
      background: linear-gradient(135deg, #fb923c, #facc15);
      color: #0f172a;
    }
    .key-hint { color: #cbd5e1; font-size: 14px; font-weight: 700; padding: 0 4px; }
    .toast-tip {
      position: fixed;
      top: 106px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(15, 23, 42, 0.92);
      color: #fde047;
      border: 1.5px solid #fde047;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: all 0.22s ease;
      z-index: 40;
      white-space: nowrap;
    }
    .toast-tip.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 0ms 极速启动壳，消除国内移动网络白屏等待 */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: radial-gradient(circle at 50% 35%, #0369a1 0%, #082f49 58%, #020617 100%);
      color: #f8fafc;
      transition: opacity 0.28s ease;
    }
    #boot-splash.hide { opacity: 0; pointer-events: none; }
    .boot-title { font-size: 24px; font-weight: 900; letter-spacing: 0.6px; }
    .boot-sub { font-size: 13px; color: #bae6fd; font-weight: 700; }
    .boot-bar { width: 220px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.16); overflow: hidden; }
    .boot-fill { width: 45%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #38bdf8, #4ade80); animation: bootSlide 1.1s ease-in-out infinite alternate; }
    @keyframes bootSlide { from { transform: translateX(-25%); } to { transform: translateX(135%); } }

    /* B站参赛作品回流点赞胶囊 */
    .bili-float-link {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      background: linear-gradient(135deg, #fb7299, #ec4899);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      padding: 4px 11px;
      border-radius: 999px;
      border: 1.5px solid rgba(255,255,255,0.65);
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.35);
      transition: transform 0.12s;
    }
    .bili-float-link:hover { transform: translateY(-1px); filter: brightness(1.06); }

    /* 自定义魔鬼关卡挑战码面板 */
    .challenge-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      width: min(92vw, 440px);
      background: rgba(8, 15, 30, 0.94);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(56, 189, 248, 0.8);
      border-radius: 20px;
      padding: 18px 20px;
      color: #fff;

      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);

      pointer-events: none;
      transition: all 0.2s ease;

    .ch-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .ch-title { font-size: 17px; font-weight: 900; color: #fde047; }
    .ch-close { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 8px; padding: 3px 9px; cursor: pointer; font-weight: 800; }
    .ch-row { margin: 10px 0; }

    .ch-row input[type="range"] { width: 100%; accent-color: #38bdf8; }
    .ch-code-box { display: flex; gap: 8px; margin-top: 10px; }
    .ch-code-input { flex: 1; background: #0f172a; border: 1.5px solid #38bdf8; border-radius: 10px; color: #fde047; font-family: "SF Mono", monospace; font-size: 14px; font-weight: 800; padding: 8px 10px; }
    .ch-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .beat-ai-tag {
      display: inline-block;
      margin-top: 6px;
      background: linear-gradient(135deg, #facc15, #f97316);
      color: #0f172a;
      font-size: 13px;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(250, 204, 21, 0.45);
    }

    @media (max-width: 900px) {
      .hud-top {
        top: 8px;
        left: 8px;
        right: 8px;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        width: auto;
      }
      .mode-card { padding: 7px 10px; max-width: 100%; border-radius: 12px; width: 100%; }
      .mode-header { gap: 6px; margin-bottom: 3px; }
      .mode-pill { font-size: 12px; padding: 3px 9px; max-width: 100%; white-space: normal; }
      .best-chip { font-size: 11px; padding: 2px 7px; }
      .rule-line { font-size: 11px; line-height: 1.3; }
      .telemetry-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; }
      .gauge { min-width: 0; width: 100%; padding: 5px 4px; border-radius: 11px; }
      .gauge-lbl { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .gauge-val { font-size: 18px; }
      .result-banner { padding: 14px 16px; font-size: 20px; border-radius: 16px; width: calc(100vw - 24px); }
      .result-sub { font-size: 13px; }
      .res-btn { padding: 8px 11px; font-size: 12px; }
      .controls-bar {
        bottom: 10px;
        left: 8px;
        right: 8px;
        transform: none;
        max-width: none;
        width: auto;
        padding: 8px 8px;
        gap: 6px;
        border-radius: 15px;
        flex-direction: column;
      }
      .ctl-group { width: 100%; display: flex; gap: 5px; flex-wrap: nowrap; justify-content: stretch; }
      .ctl-btn { flex: 1; min-width: 0; padding: 9px 4px; font-size: 12px; border-radius: 9px; text-align: center; overflow: hidden; text-overflow: ellipsis; }
      .ctl-btn.fire { flex: 1.9; min-width: 0; padding: 11px 6px; font-size: 14px; }
      .key-hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="boot-title">🚀 3D 海上火箭回收挑战</div>
    <div class="boot-sub" id="boot-sub">正在启动 3D 物理引擎与海面渲染...</div>

  <div class="hud-top">

      <div class="mode-header">
        <div class="mode-pill" id="mode-pill">人类手操挑战 · 第1把</div>

        <a class="bili-float-link" id="bili-float-link" href="https://www.bilibili.com/video/BV1SSsh6iEZ6" target="_blank" rel="noopener">📺 给B站作品点赞支持</a>
      </div>
      <div class="rule-line" id="rule-line">规则：落地速度 ≤ 4.5 m/s 且不歪斜，剩油越多分越高！（按 空格/↑/W 点火，←/→ 或 A/D 调姿）</div>

    <div id="beat-ai-wrap"></div>
    <div class="result-sub" id="res-sub">触地过猛(需 ≤ 4.5 m/s)，回收船直接报废！</div>
    <div class="score-poster-wrap" id="score-poster-wrap">
      <img class="score-poster-img" id="score-poster-img" alt="3D 战绩截图预览" title="点击下载高清战绩图，手机可长按保存" onclick="downloadScorePoster()" />
      <div class="score-poster-tip">📸 已自动抓拍 3D 战绩图（电脑点下方按钮一键复制/保存，手机也可长按图片保存）</div>
    </div>
    <div class="result-actions" id="result-actions">
      <button class="res-btn bili" onclick="shareToBilibili()">🚀 去B站评论区晒分 (复制文案+存图)</button>

      <button class="res-btn" onclick="openChallengeModal()">🧩 造魔鬼关卡难倒别人</button>

  <!-- 自定义魔鬼关卡挑战码弹窗（B站评论区互发挑战码裂变闭环） -->

    <div class="ch-head">

  <div class="controls-bar" id="controls-bar">

  <script src="./three.min.js"></script>
  <script>
    // =========================================================================
    // 电影级 PBR + GLSL 大气海洋 + 柔光体积火焰烟雾 3D 火箭回收引擎 (v2.0 AAA 写实版)
    // =========================================================================
    const canvas = document.getElementById("gl-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance", preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x7dd3fc, 0.0020);

    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.5, 900);
    camera.position.set(0, 32, 72);

    // 1. 程序化高清 PBR 纹理工厂 (彻底消除低模纯色塑料感 & 消除实心圆球马赛克!)
    function makeSoftGlowTexture(stops) {
      const c = document.createElement("canvas");
      c.width = c.height = 256;
      const ctx = c.getContext("2d");
      const g = ctx.createRadialGradient(128, 128, 4, 128, 128, 126);
      stops.forEach(([pos, col]) => g.addColorStop(pos, col));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);
      // 叠加细微有机云团笔触, 让火焰与烟雾呈现自然翻涌云团质感
      for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * 44;
        const rad = 28 + Math.random() * 34;
        const x = 128 + Math.cos(a) * r;
        const y = 128 + Math.sin(a) * r;
        const g2 = ctx.createRadialGradient(x, y, 2, x, y, rad);
        g2.addColorStop(0, stops[1][1]);
        g2.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g2;
        ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    const texFire = makeSoftGlowTexture([
      [0.0, "rgba(255,255,235,1.0)"],
      [0.25, "rgba(255,190,60,0.92)"],

    ]);
    const texDarkSmoke = makeSoftGlowTexture([

    const texCloud = makeSoftGlowTexture([

    // 1024x1024 高精航天一级火箭蒙皮纹理 (金属接缝 + 再入灼烧烟熏渐变 + 编号 B-109 + 黑色管路!)
    function makeRocketTexture() {
      const c = document.createElement("canvas");
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext("2d");
      // 洁白航空涂装底色 + 底部真实再入大气层烟熏焦黑渐变!
      const bg = ctx.createLinearGradient(0, 0, 0, 1024);
      bg.addColorStop(0.0, "#f8fafc");
      bg.addColorStop(0.55, "#e2e8f0");
      bg.addColorStop(0.82, "#94a3b8");
      bg.addColorStop(0.95, "#475569");
      bg.addColorStop(1.0, "#1e293b");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 1024, 1024);

      // 真实铝合金铆钉板接缝网格
      ctx.strokeStyle = "rgba(15, 23, 42, 0.16)";
      ctx.lineWidth = 2;
      for (let y = 64; y < 1024; y += 64) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
      }
      for (let x = 128; x < 1024; x += 128) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1024); ctx.stroke();
      }

      // 细微纵向大气再入黑灰条纹
      for (let i = 0; i < 48; i++) {
        const sx = Math.random() * 1024;
        const sg = ctx.createLinearGradient(0, 480, 0, 1024);
        sg.addColorStop(0, "rgba(30,41,59,0)");
        sg.addColorStop(1, "rgba(15,23,42,0.22)");
        ctx.fillStyle = sg;
        ctx.fillRect(sx, 480, 6 + Math.random() * 18, 544);
      }

      // 醒目红色航天腰带 + 垂直蓝色涂装标识
      ctx.fillStyle = "#dc2626";
      ctx.fillRect(0, 175, 1024, 48);
      ctx.fillStyle = "#0284c7";
      ctx.fillRect(0, 232, 1024, 16);

      // 两侧清晰航空编号 B-109
      ctx.fillStyle = "#0f172a";
      ctx.font = "900 58px Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("B-109", 256, 360);
      ctx.fillText("B-109", 768, 360);
      ctx.font = "700 28px Arial, sans-serif";
      ctx.fillStyle = "#334155";
      ctx.fillText("ORBITAL BOOSTER", 256, 405);
      ctx.fillText("ORBITAL BOOSTER", 768, 405);

      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = 8;
      return tex;
    }

    // 1024x1024 高精写实钢铁海工回收甲板纹理 (钢板焊缝 + 黄黑警戒斑马边线 + 烧焦靶心 + 锐利 H 标志)
    function makeDeckTexture() {
      const c = document.createElement("canvas");
      c.width = 1024; c.height = 1024;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#162032";
      ctx.fillRect(0, 0, 1024, 1024);

      // 钢板拼缝与微弱海水风化噪点
      ctx.strokeStyle = "rgba(148,163,184,0.14)";
      ctx.lineWidth = 2;
      for (let i = 0; i <= 1024; i += 64) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 1024); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1024, i); ctx.stroke();
      }
      for (let i = 0; i < 400; i++) {
        ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.035})`;
        ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 12 + Math.random() * 40, 12 + Math.random() * 40);
      }

      // 中央真实火箭尾焰炙烤的淡淡焦黑圈
      const scorch = ctx.createRadialGradient(512, 512, 40, 512, 512, 340);
      scorch.addColorStop(0, "rgba(0,0,0,0.58)");
      scorch.addColorStop(0.65, "rgba(15,23,42,0.28)");
      scorch.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = scorch;
      ctx.fillRect(0, 0, 1024, 1024);

      // 四周高可见度黄黑安全警戒条纹边框
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 22;
      ctx.strokeRect(36, 36, 952, 952);
      ctx.setLineDash([28, 28]);
      ctx.strokeStyle = "#0f172a";
      ctx.lineWidth = 22;
      ctx.strokeRect(36, 36, 952, 952);
      ctx.setLineDash([]);

      // 居中醒目亮黄双靶环与巨型 H 着陆标记
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 28;
      ctx.beginPath(); ctx.arc(512, 512, 265, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 8;
      ctx.strokeStyle = "rgba(250, 204, 21, 0.55)";
      ctx.beginPath(); ctx.arc(512, 512, 320, 0, Math.PI * 2); ctx.stroke();

      ctx.fillStyle = "#facc15";
      ctx.fillRect(390, 365, 48, 294);
      ctx.fillRect(586, 365, 48, 294);
      ctx.fillRect(390, 488, 244, 48);

      // 甲板角落专业航标文字
      ctx.fillStyle = "rgba(226,232,240,0.75)";
      ctx.font = "900 38px Arial, sans-serif";
      ctx.fillText("ASDS-01", 80, 118);
      ctx.fillText("LANDING ZONE", 660, 945);

      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = 8;
      return tex;
    }

    // 2. 电影级 GLSL 大气散射 + 5阶 FBM 体积积云天空穹顶 (彻底告别椭圆贴图假云!)
    const skyUniforms = {
      uTime:      { value: 0.0 },
      uCloudAmt:  { value: 1.0 },
      uTopColor:  { value: new THREE.Color(0x0c4a8a) },
      uMidColor:  { value: new THREE.Color(0x3898e0) },
      uHorColor:  { value: new THREE.Color(0xdbeafe) },
      uSunDir:    { value: new THREE.Vector3(-0.32, 0.34, -0.88).normalize() },
      uSunColor:  { value: new THREE.Color(0xfffbeb) },
      uCloudLit:  { value: new THREE.Color(0xffffff) },
      uCloudShad: { value: new THREE.Color(0x94b8d8) }
    };
    const skyDome = new THREE.Mesh(
      new THREE.SphereGeometry(580, 48, 32),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: skyUniforms,
        vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uCloudAmt;
          uniform vec3 uTopColor;
          uniform vec3 uMidColor;
          uniform vec3 uHorColor;
          uniform vec3 uSunDir;
          uniform vec3 uSunColor;
          uniform vec3 uCloudLit;
          uniform vec3 uCloudShad;
          varying vec3 vWorldPos;

          float hash(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
          }
          float vnoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            float a = hash(i);
            float b = hash(i + vec2(1.0, 0.0));
            float c = hash(i + vec2(0.0, 1.0));
            float d = hash(i + vec2(1.0, 1.0));
            return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
          }
          float fbm(vec2 p) {
            float v = 0.0;
            float a = 0.5;
            mat2 rot = mat2(0.80, 0.60, -0.60, 0.80);
            for (int i = 0; i < 5; i++) {
              v += a * vnoise(p);
              p = rot * p * 2.04 + vec2(1.7, 9.2);
              a *= 0.5;
            }
            return v;
          }

          void main() {
            vec3 dir = normalize(vWorldPos);
            float h = clamp(dir.y, 0.0, 1.0);
            // 真实瑞利+米氏大气散射天空渐变
            vec3 sky = mix(uHorColor, uMidColor, pow(h, 0.36));
            sky = mix(sky, uTopColor, pow(h, 1.05));

            float sunDot = max(dot(dir, uSunDir), 0.0);
            sky += uSunColor * pow(sunDot, 14.0) * 0.28;
            sky += uSunColor * pow(sunDot, 120.0) * 0.55;
            sky += uSunColor * pow(sunDot, 900.0) * 1.6;

            // 真实透视投影 5 阶 FBM 体积积云 (带太阳方向自阴影与银边高光!)
            if (dir.y > 0.015 && uCloudAmt > 0.01) {
              vec2 uv = dir.xz / (dir.y + 0.16) * 0.68;
              vec2 wind = vec2(uTime * 0.018, uTime * 0.006);
              float warp = fbm(uv * 1.4 + wind);
              float n1 = fbm(uv + wind + warp * 0.35);
              float dens = smoothstep(0.46, 0.78, n1) * uCloudAmt;

              // 沿太阳方向采样一次制造云层立体明暗厚度与银边!
              vec2 sunStep = normalize(uSunDir.xz) * 0.14;
              float nSun = fbm(uv + wind + warp * 0.35 + sunStep);
              float lightDiff = clamp((n1 - nSun) * 3.4 + 0.55, 0.0, 1.0);
              vec3 cloudCol = mix(uCloudShad, uCloudLit, lightDiff);
              cloudCol += uSunColor * pow(sunDot, 10.0) * (1.0 - dens * 0.45) * 0.42;

              // 地平线自然空气透视消融
              float horFade = smoothstep(0.015, 0.16, dir.y);
              sky = mix(sky, cloudCol, dens * horFade * 0.92);
            }

            // 仅月球深空模式下点缀繁星
            if (uCloudAmt < 0.05 && dir.y > 0.05) {
              vec2 starUv = floor(dir.xz / (dir.y + 0.5) * 180.0);
              float st = step(0.994, hash(starUv));
              sky += vec3(0.95, 0.97, 1.0) * st * 0.85;
            }

            gl_FragColor = vec4(sky, 1.0);
          }
        `
      })
    );
    scene.add(skyDome);

    // 3. 电影级 Seascape 多旋转阶波浪法线 GLSL 大海 (彻底消除棋盘格高光, 实现真实粼粼海浪+碎浪泡沫+云天倒影!)
    const oceanUniforms = {
      uTime:     { value: 0.0 },
      uDeepCol:  { value: new THREE.Color(0x032541) },
      uShalCol:  { value: new THREE.Color(0x0b6490) },
      uSkyTop:   { value: new THREE.Color(0x0c4a8a) },
      uSkyHor:   { value: new THREE.Color(0xdbeafe) },
      uSunDir:   { value: new THREE.Vector3(-0.32, 0.34, -0.88).normalize() },
      uSunCol:   { value: new THREE.Color(0xfffbeb) }
    };
    const oceanMat = new THREE.ShaderMaterial({
      uniforms: oceanUniforms,
      vertexShader: `
        uniform float uTime;
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          // 非正交多方向涌浪起伏
          float w = sin(wp.x * 0.055 + wp.z * 0.035 + uTime * 1.6) * 0.45
                  + sin(-wp.x * 0.042 + wp.z * 0.072 + uTime * 2.1) * 0.32;
          wp.y += w;
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uDeepCol;
        uniform vec3 uShalCol;
        uniform vec3 uSkyTop;
        uniform vec3 uSkyHor;
        uniform vec3 uSunDir;
        uniform vec3 uSunCol;
        varying vec3 vWorldPos;

        float hash2(vec2 p) {
          p = fract(p * vec2(127.1, 311.7));
          p += dot(p, p + 19.19);
          return fract(p.x * p.y);
        }
        float noise2(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash2(i), hash2(i + vec2(1.0, 0.0)), u.x),
            mix(hash2(i + vec2(0.0, 1.0)), hash2(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }

        // 电影级 7 方向非正交旋转 Gerstner 太平洋涌浪 + 精细 FBM 风成微涟漪 (零网格、零圆斑!)
        float seaHeight(vec2 p, float t) {
          float h = 0.0;
          // 7 组互为无理数夹角的真实海洋涌浪与风浪
          h += sin(dot(p, vec2( 0.96,  0.28)) * 0.065 + t * 1.45) * 0.42;
          h += sin(dot(p, vec2( 0.58, -0.81)) * 0.095 + t * 1.85) * 0.30;
          h += sin(dot(p, vec2(-0.74,  0.67)) * 0.145 + t * 2.30) * 0.20;
          h += sin(dot(p, vec2( 0.19,  0.98)) * 0.240 - t * 2.75) * 0.13;
          h += sin(dot(p, vec2(-0.92, -0.39)) * 0.390 + t * 3.20) * 0.08;
          h += sin(dot(p, vec2( 0.83,  0.55)) * 0.680 - t * 3.90) * 0.045;
          h += sin(dot(p, vec2(-0.36,  0.93)) * 1.180 + t * 4.60) * 0.025;
          // 叠加两层柔和 FBM 细碎水波纹
          h += (noise2(p * 0.22 + vec2(t * 0.55, -t * 0.32)) - 0.5) * 0.24;
          h += (noise2(p * 0.68 + vec2(-t * 0.72, t * 0.48)) - 0.5) * 0.09;
          return h;
        }

        void main() {
          float dist = length(cameraPosition - vWorldPos);
          float eps = max(0.16, dist * 0.0028);
          float hC = seaHeight(vWorldPos.xz, uTime);
          float hX = seaHeight(vWorldPos.xz + vec2(eps, 0.0), uTime);
          float hZ = seaHeight(vWorldPos.xz + vec2(0.0, eps), uTime);
          float normalStrength = clamp(1.05 - dist * 0.0018, 0.22, 0.95);
          vec3 N = normalize(vec3((hC - hX) / eps * normalStrength, 1.0, (hC - hZ) / eps * normalStrength));
          vec3 V = normalize(cameraPosition - vWorldPos);

          // 真实 Schlick 菲涅尔反射
          float ndotv = max(dot(N, V), 0.0);
          float fresnel = clamp(0.03 + 0.92 * pow(1.0 - ndotv, 4.5), 0.0, 0.88);

          // 反射光线采样天空渐变 (自然深蓝与晴空融合)
          vec3 R = reflect(-V, N);
          vec3 reflSky = mix(uSkyHor, uSkyTop, pow(clamp(R.y, 0.0, 1.0), 0.48));

          // 真实太平洋深蓝海体散射 + 浪脊透亮翡翠蓝绿高光
          vec3 refractCol = mix(uDeepCol, uShalCol, clamp(hC * 0.42 + 0.50, 0.0, 1.0));
          float sss = pow(max(dot(V, -uSunDir + N * 0.45), 0.0), 3.5) * clamp(hC * 0.5 + 0.35, 0.0, 1.0);
          refractCol += vec3(0.03, 0.36, 0.46) * sss * 0.65;

          vec3 col = mix(refractCol, reflSky, fresnel * 0.68);

          // 真实细腻的太阳海面碎钻粼粼波光
          float specSharp = pow(max(dot(R, uSunDir), 0.0), 360.0);
          float specSoft  = pow(max(dot(R, uSunDir), 0.0), 36.0);
          col += uSunCol * (specSharp * 2.4 + specSoft * 0.22);

          // 细腻自然的少量浪尖碎白沫 + 回收船四周真实海水浪花环
          float foamN = noise2(vWorldPos.xz * 0.42 + uTime * 0.45) * noise2(vWorldPos.xz * 1.15 - uTime * 0.35);
          float crestFoam = smoothstep(0.68, 1.05, hC + foamN * 0.32) * smoothstep(220.0, 25.0, dist);
          float shipD = length(vWorldPos.xz * vec2(0.75, 1.12));
          float shipWake = smoothstep(15.2, 11.4, shipD) * smoothstep(9.2, 11.4, shipD) * (0.45 + 0.55 * foamN);
          col = mix(col, vec3(0.94, 0.98, 1.0), clamp(crestFoam * 0.42 + shipWake * 0.78, 0.0, 0.88));

          // 柔和远海地平线空气透视融雾
          float fogAmt = 1.0 - exp(-pow(dist * 0.0021, 2.0));
          col = mix(col, uSkyHor, clamp(fogAmt, 0.0, 0.94));

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    const ocean = new THREE.Mesh(new THREE.PlaneGeometry(980, 980, 160, 160).rotateX(-Math.PI / 2), oceanMat);
    scene.add(ocean);

    // 3B. 科学写实 3D 固态行星地貌工厂 (火星荒漠陨石坑峡谷 & 月球环形山玄武岩月壤 — 绝无液态水!)
    function buildPlanetaryTerrain(isMars) {
      const geo = new THREE.PlaneGeometry(960, 960, 180, 180);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;

      // 预置 22 个真实环形山/陨石坑 (避开中心着陆坪 r < 26)
      const craters = [];
      let s = isMars ? 1337 : 4242;
      const rand = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
      for (let i = 0; i < 24; i++) {
        const ang = rand() * Math.PI * 2;
        const dist = 34 + rand() * 240;
        const rad = 10 + rand() * (isMars ? 28 : 34);
        const depth = rad * (isMars ? 0.16 : 0.22);
        craters.push({ x: Math.cos(ang) * dist, z: Math.sin(ang) * dist, r: rad, d: depth });
      }

      const colors = new Float32Array(pos.count * 3);
      const baseCol = new THREE.Color(isMars ? 0xb4532a : 0x6b7280);
      const highCol = new THREE.Color(isMars ? 0xd97742 : 0x9ca3af);
      const lowCol  = new THREE.Color(isMars ? 0x6c2812 : 0x374151);
      const tmpC = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        const px = pos.getX(i);
        const pz = pos.getZ(i);
        const rCenter = Math.hypot(px, pz);
        // 中心着陆区 (r < 22) 平整硬化地基, 外围自然过渡到起伏山地与陨石坑
        const flatMask = Math.min(1.0, Math.max(0.0, (rCenter - 20.0) / 24.0));

        // 多阶山地峡谷起伏
        let h = (Math.sin(px * 0.018) * Math.cos(pz * 0.016) * (isMars ? 14.0 : 9.0)
               + Math.sin(px * 0.048 + pz * 0.036) * (isMars ? 5.2 : 3.8)
               + Math.cos(px * 0.11 - pz * 0.09) * 1.4
               + Math.sin(px * 0.27 + pz * 0.23) * 0.45) * flatMask;

        // 远景高山脊/火星峡谷台地
        if (rCenter > 130) {
          h += Math.pow((rCenter - 130) / 140, 1.55) * (isMars ? 34.0 : 22.0)
             * (0.55 + 0.45 * Math.sin(Math.atan2(pz, px) * 5.0 + 1.2));
        }

        // 叠加真实环形山凹坑与凸起坑缘 (Crater Bowl + Raised Rim)
        for (let c = 0; c < craters.length; c++) {
          const cr = craters[c];
          const d = Math.hypot(px - cr.x, pz - cr.z) / cr.r;
          if (d < 1.35) {
            if (d < 1.0) {
              h -= Math.cos(d * Math.PI * 0.5) * cr.d * flatMask;
            } else {
              const rim = Math.sin(((d - 1.0) / 0.35) * Math.PI);
              h += rim * cr.d * 0.32 * flatMask;
            }
          }
        }
        pos.setY(i, h);

        // 干涸岩土哑光顶点微着色 (绝无反光水感!)
        const nTone = Math.sin(px * 0.08 + pz * 0.07) * 0.5 + 0.5;
        if (h >= 0) {
          tmpC.copy(baseCol).lerp(highCol, Math.min(1.0, h / 18.0 * 0.75 + nTone * 0.25));
        } else {
          tmpC.copy(baseCol).lerp(lowCol, Math.min(1.0, (-h) / 10.0 * 0.85 + (1 - nTone) * 0.15));
        }
        colors[i * 3] = tmpC.r;
        colors[i * 3 + 1] = tmpC.g;
        colors[i * 3 + 2] = tmpC.b;
      }
      geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      // 哑光岩土/风化月壤材质 (roughness=0.96, metalness=0.02 -> 100% 干燥固态地表!)
      const mat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.96,
        metalness: 0.02,
      });

    let audioCtx = null;

    function ensureAudio() {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
          const bufLen = audioCtx.sampleRate * 2;
          const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
          const ch = noiseBuf.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufLen; i++) {
            const w = Math.random() * 2 - 1;
            b0 = 0.997 * b0 + w * 0.029;
            b1 = 0.985 * b1 + w * 0.032;
            b2 = 0.950 * b2 + w * 0.048;
            ch[i] = Math.max(-1, Math.min(1, (b0 + b1 + b2 + w * 0.14) * 2.2));
          }
          const src = audioCtx.createBufferSource();
          src.buffer = noiseBuf;
          src.loop = true;
          thrusterFilter = audioCtx.createBiquadFilter();
          thrusterFilter.type = "lowpass";
          thrusterFilter.frequency.value = 260;
          thrusterGain = audioCtx.createGain();
          thrusterGain.gain.value = 0.0;
          src.connect(thrusterFilter);
          thrusterFilter.connect(thrusterGain);
          thrusterGain.connect(audioCtx.destination);
          src.start();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) {}
    }

    function updateThrusterSound(lvl) {
      if (!audioCtx || !thrusterGain || !thrusterFilter) return;
      const now = audioCtx.currentTime;
      const targetGain = (audioEnabled && window._autoLoop && lvl > 0.02) ? (0.04 + lvl * 0.18) : 0.0;
      thrusterGain.gain.setTargetAtTime(targetGain, now, 0.05);
      thrusterFilter.frequency.setTargetAtTime(180 + lvl * 520, now, 0.06);
    }

    function playWinChime() {
      if (!audioEnabled || !window._autoLoop) return;
      ensureAudio();
      if (!audioCtx) return;
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        const t = audioCtx.currentTime + idx * 0.09;
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.4);
      });
    }

      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.exponentialRampToValueAtTime(28, now + 0.65);
      g.gain.setValueAtTime(0.24, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.72);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.75);
    }

    function getPosterFilename() {
      const tag = lastResultMeta.ok ? `剩油${lastResultMeta.fuel}%` : `炸船${lastResultMeta.spd}ms`;

    }

    function drawRoundRect(ctx, rx, ry, rw, rh, rad) {
      ctx.beginPath();
      ctx.moveTo(rx + rad, ry);
      ctx.arcTo(rx + rw, ry, rx + rw, ry + rh, rad);
      ctx.arcTo(rx + rw, ry + rh, rx, ry + rh, rad);
      ctx.arcTo(rx, ry + rh, rx, ry, rad);
      ctx.arcTo(rx, ry, rx + rw, ry, rad);
      ctx.closePath();
    }

    function captureScorePoster() {
      try {
        // 先渲染当前着陆/爆炸最新一帧，确保 3D 火花/白烟/火箭入镜
        renderer.render(scene, camera);
        const src = renderer.domElement;
        const W = 1280, H = 720;
        const off = document.createElement("canvas");
        off.width = W; off.height = H;
        const ctx = off.getContext("2d");

        // 居中裁剪铺满 16:9 电影级底图
        const sw = src.width || 1280, sh = src.height || 720;
        const srcAsp = sw / sh, dstAsp = W / H;
        let sx = 0, sy = 0, cw = sw, ch = sh;
        if (srcAsp > dstAsp) {
          cw = sh * dstAsp;
          sx = (sw - cw) * 0.5;
        } else {
          ch = sw / dstAsp;
          sy = (sh - ch) * 0.5;
        }
        ctx.drawImage(src, sx, sy, cw, ch, 0, 0, W, H);

        // 顶部柔和渐变暗角 + 赛事标题徽章
        const topGrad = ctx.createLinearGradient(0, 0, 0, 140);
        topGrad.addColorStop(0, "rgba(8, 15, 30, 0.78)");
        topGrad.addColorStop(1, "rgba(8, 15, 30, 0)");
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, W, 140);

        ctx.fillStyle = "#ffffff";
        ctx.font = "900 32px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
        ctx.fillText("🚀 3D 海上火箭回收挑战 · B站AI创造公开赛", 38, 60);

        const pIcon = lastResultMeta.planet === "月球" ? "🌙" : (lastResultMeta.planet === "火星" ? "🔴" : (lastResultMeta.planet === "10级台风" ? "🌪️" : "🌍"));
        const modeTxt = lastResultMeta.mode === "ai" ? "🤖 AI 自动飞控" : "🎮 人类手操挑战";
        drawRoundRect(ctx, W - 360, 24, 322, 48, 24);
        ctx.fillStyle = "rgba(15, 23, 42, 0.82)";
        ctx.fill();
        ctx.strokeStyle = "rgba(56, 189, 248, 0.85)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#e0f2fe";
        ctx.font = "800 22px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`${pIcon} ${lastResultMeta.planet}  |  ${modeTxt}`, W - 199, 56);
        ctx.textAlign = "left";

        // 底部毛玻璃战绩大卡
        const cardY = H - 236;
        drawRoundRect(ctx, 36, cardY, W - 72, 200, 24);
        const cardGrad = ctx.createLinearGradient(36, cardY, W - 36, cardY + 200);
        if (lastResultMeta.ok) {
          cardGrad.addColorStop(0, "rgba(4, 96, 70, 0.90)");
          cardGrad.addColorStop(1, "rgba(8, 22, 42, 0.92)");
        } else {
          cardGrad.addColorStop(0, "rgba(153, 27, 27, 0.90)");
          cardGrad.addColorStop(1, "rgba(20, 18, 32, 0.92)");
        }
        ctx.fillStyle = cardGrad;
        ctx.fill();
        ctx.strokeStyle = lastResultMeta.ok ? "#fde047" : "#fb923c";
        ctx.lineWidth = 3.5;
        ctx.stroke();

        // 主标题
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 42px -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif";
        const beatAi = lastResultMeta.ok && lastResultMeta.mode === "human" && Number(lastResultMeta.fuel) >= 60;
        const headline = lastResultMeta.ok
          ? (beatAi
              ? `🏅 击败AI飞控大师 · 剩油 ${lastResultMeta.fuel}% (S+)`
              : `🏆 回收成功 · 剩油 ${lastResultMeta.fuel}% (${lastResultMeta.grade})`)
          : `💥 回收失败 · 触地降速 ${lastResultMeta.spd} m/s`;
        ctx.fillText(headline, 72, cardY + 66);

        // 3 项核心战绩数据条
        const kpis = [
          { lbl: "剩余燃料 (FUEL)", val: `${lastResultMeta.fuel}%`, col: lastResultMeta.fuel >= 30 ? "#4ade80" : "#facc15" },
          { lbl: "触地降速 (SPD)", val: `${lastResultMeta.spd} m/s`, col: parseFloat(lastResultMeta.spd) <= 4.5 ? "#4ade80" : "#f87171" },
          { lbl: "挑战星体 / 模式", val: `${lastResultMeta.planet} · ${lastResultMeta.mode === "ai" ? "AI飞控" : "人类手操"}`, col: "#38bdf8" }
        ];
        kpis.forEach((k, idx) => {
          const kx = 72 + idx * 380;
          const ky = cardY + 90;
          drawRoundRect(ctx, kx, ky, 356, 68, 14);
          ctx.fillStyle = "rgba(15, 23, 42, 0.72)";
          ctx.fill();
          ctx.fillStyle = "#93c5fd";
          ctx.font = "700 17px -apple-system, 'PingFang SC', sans-serif";
          ctx.fillText(k.lbl, kx + 18, ky + 25);
          ctx.fillStyle = k.col;
          ctx.font = "900 28px 'SF Mono', 'PingFang SC', monospace";
          ctx.fillText(k.val, kx + 18, ky + 56);
        });

        // 底部在线即玩水印引导
        ctx.fillStyle = "#fde68a";
        ctx.font = "700 18px -apple-system, 'PingFang SC', sans-serif";
        ctx.fillText("🌐 手机/电脑在线直玩：nanqi1982.github.io/rocket-lander-3d    ｜    📺 B站搜 BV1SSsh6iEZ6 来评论区晒分挑战！", 72, cardY + 184);

        lastPosterDataUrl = off.toDataURL("image/png");
        const imgEl = document.getElementById("score-poster-img");
        const wrapEl = document.getElementById("score-poster-wrap");
        if (imgEl && wrapEl) {
          imgEl.src = lastPosterDataUrl;
          wrapEl.classList.add("ready");
        }
        off.toBlob(blob => { lastPosterBlob = blob; }, "image/png");
      } catch (e) {}
    }

    function copyPlainText(txt) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(txt).catch(() => false);
      }
      const ta = document.createElement("textarea");
      ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      return Promise.resolve(true);
    }

    function downloadScorePoster() {
      if (!lastPosterDataUrl) captureScorePoster();
      if (!lastPosterDataUrl) return;
      const a = document.createElement("a");
      a.href = lastPosterDataUrl;
      a.download = getPosterFilename();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast("📸 高清 3D 战绩图已保存到本地，发评论时可直接附上图！");
    }

    async function copyScoreImage() {
      if (!lastPosterBlob && !lastPosterDataUrl) captureScorePoster();
      const txt = getShareText();
      // 移动端优先拉起系统原生图文分享（同时带图+带文）
      if (navigator.share && lastPosterBlob && /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
        try {
          const file = new File([lastPosterBlob], getPosterFilename(), { type: "image/png" });
          if (!navigator.canShare || navigator.canShare({ files: [file] })) {
            await navigator.share({ title: "3D海上火箭回收挑战战绩", text: txt, files: [file] });
            return;
          }
        } catch (e) {}
      }
      // 桌面端把纯 PNG 写入剪贴板，去 B站评论区/微信 可直接 Ctrl+V / Cmd+V 贴图！
      if (navigator.clipboard && window.ClipboardItem && lastPosterBlob) {
        try {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": lastPosterBlob })]);
          showToast("🖼️ 高清战绩图已复制！去 B 站评论区直接 Ctrl+V / Cmd+V 就能贴图！");
          return;
        } catch (e) {}
      }
      downloadScorePoster();
    }

      if (!lastPosterDataUrl) captureScorePoster();

    function clearParticles() {
      parts.forEach(p => { p.life = 0; p.sprite.visible = false; });
    }

    function applyPlanetTheme() {
      const pl = PLANETS[planetIdx];
      const isOcean = !!pl.isOcean;
      const isMoon  = (planetIdx === 1);
      const isMars  = (planetIdx === 2);
      const isTyphoon = (planetIdx === 3);

      // 严格物理地貌切换: 地球/10级台风=太平洋海面与船体吃水线; 火星=红色荒漠峡谷陨石坑; 月球=银灰环形山+星空地球升起!
      ocean.visible = isOcean;
      marsTerrain.visible = isMars;
      moonTerrain.visible = isMoon;
      earthInSky.visible = isMoon;
      waterline.visible = isOcean;

      skyUniforms.uTopColor.value.setHex(pl.skyTop);
      skyUniforms.uMidColor.value.setHex(pl.skyMid);
      skyUniforms.uHorColor.value.setHex(pl.skyHor);
      skyUniforms.uCloudAmt.value = (isMoon ? 0.0 : (isMars ? 0.45 : (isTyphoon ? 1.35 : 1.0)));
      skyUniforms.uCloudLit.value.setHex(isMars ? 0xfed7aa : (isTyphoon ? 0x94a3b8 : 0xffffff));
      skyUniforms.uCloudShad.value.setHex(isMars ? 0x9a3412 : (isTyphoon ? 0x1e293b : 0x8eaec9));
      oceanUniforms.uDeepCol.value.setHex(pl.seaDeep);
      oceanUniforms.uShalCol.value.setHex(pl.seaShal);
      oceanUniforms.uSkyTop.value.setHex(pl.skyTop);
      oceanUniforms.uSkyHor.value.setHex(pl.skyHor);
      scene.fog.color.setHex(pl.fog);
      scene.fog.density = isMoon ? 0.0001 : (isMars ? 0.0024 : (isTyphoon ? 0.0032 : 0.0018));

      // 固态星球上着陆坪牢牢锚定地表, 绝不漂浮晃动!
      if (!isOcean) {
        shipGroup.position.y = -0.35;
        shipGroup.rotation.z = 0;
      }

      document.getElementById("btn-env").textContent = (pl.icon || "🌍") + " " + pl.name;
      document.getElementById("env-badge").textContent = pl.windTxt;
      updateBestBadge();
    }

    function cyclePlanet(idxOverride) {
      if (typeof idxOverride === "number") {
        planetIdx = idxOverride;
      } else {
        planetIdx = (planetIdx + 1) % 4; // 常规轮切 地球/月球/火星/10级台风；自定义关由挑战码入口触发
      }
      if (planetIdx !== 4) activeChallengeCode = "";
      applyPlanetTheme();
      startRun(controlMode);
    }

    function buzz(pattern) {
      try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}

    function openChallengeModal() {
      const m = document.getElementById("challenge-modal");
      if (m) { syncChallengePreview(); m.classList.add("show"); }

      const m = document.getElementById("challenge-modal");
      if (m) m.classList.remove("show");
    }
    function syncChallengePreview() {
      const g = parseFloat(document.getElementById("ch-g").value).toFixed(1);
      const w = parseFloat(document.getElementById("ch-w").value).toFixed(1);
      const s = parseFloat(document.getElementById("ch-s").value).toFixed(1);
      document.getElementById("ch-g-val").textContent = `${g} m/s²`;
      document.getElementById("ch-w-val").textContent = `${w} 级`;
      document.getElementById("ch-s-val").textContent = `${s}x`;
      document.getElementById("ch-code-input").value = `G${g}-W${w}-S${s}`;
    }
    function applyChallengeCode(rawCode, autoHuman) {
      const m = String(rawCode || "").toUpperCase().match(/G(\d+(?:\.\d+)?)-W(\d+(?:\.\d+)?)-S(\d+(?:\.\d+)?)/);
      if (!m) {
        showToast("⚠️ 挑战码格式示例：G11.5-W6.0-S2.6");
        return false;
      }
      const g = Math.max(1.6, Math.min(14.0, parseFloat(m[1])));
      const w = Math.max(0.0, Math.min(7.5, parseFloat(m[2])));
      const s = Math.max(0.0, Math.min(3.0, parseFloat(m[3])));
      const code = `G${g.toFixed(1)}-W${w.toFixed(1)}-S${s.toFixed(1)}`;
      PLANETS[4].g = g;
      PLANETS[4].wind = w;
      PLANETS[4].waveScale = s;
      PLANETS[4].name = `挑战码 ${code}`;
      PLANETS[4].shortName = code;
      PLANETS[4].windTxt = `🧩 ${code}`;
      activeChallengeCode = code;
      planetIdx = 4;
      const gEl = document.getElementById("ch-g");
      const wEl = document.getElementById("ch-w");
      const sEl = document.getElementById("ch-s");
      const cEl = document.getElementById("ch-code-input");
      if (gEl) gEl.value = g.toFixed(1);
      if (wEl) wEl.value = w.toFixed(1);
      if (sEl) sEl.value = s.toFixed(1);
      if (cEl) cEl.value = code;
      applyPlanetTheme();
      closeChallengeModal();
      startRun(autoHuman ? "human" : controlMode);
      showToast(`🧩 已载入魔鬼挑战码 ${code}！看看你能不能不炸船落地！`);
      return true;
    }
    function applyChallengeCodeFromInput() {
      const inp = document.getElementById("ch-code-input");
      if (inp) applyChallengeCode(inp.value, true);
    }
    function launchCustomChallenge() {
      syncChallengePreview();
      applyChallengeCodeFromInput();
    }

    function startRun(modeName, customLabel) {
      controlMode = modeName || "human";
      state = "flying";
      x = controlMode === "demo_out_of_fuel" ? 16 : -22;
      y = controlMode === "demo_crash_fast" ? 115 : 138;
      vx = controlMode === "demo_out_of_fuel" ? -3.5 : 4.8;
      vy = controlMode === "demo_crash_fast" ? -16.0 : -10.5;
      angle = controlMode === "demo_out_of_fuel" ? 0.14 : -0.16;
      fuel = controlMode === "demo_out_of_fuel" ? 36.0 : 100.0;
      throttle = 0;
      legDeploy = 0;
      shakeAmt = 0;
      rocketGroup.visible = true;
      clearParticles();
      updateThrusterSound(0);

      const pill = document.getElementById("mode-pill");
      const isAi = (controlMode === "ai");
      if (controlMode === "human") humanAttemptCount += 1;
      pill.className = "mode-pill" + (isAi ? " ai" : "");
      pill.textContent = customLabel || (isAi ? "🤖 AI 自动飞控演示（按空格/点火随时接管手操）" : `🎮 人类手操挑战 · 第 ${humanAttemptCount} 把`);
      document.getElementById("btn-ai").classList.toggle("active", isAi);
      const btnHuman = document.getElementById("btn-human");
      if (btnHuman) btnHuman.classList.toggle("active", controlMode === "human");

      const spw = document.getElementById("score-poster-wrap");
      if (spw) spw.classList.remove("ready");
      lastPosterBlob = null;
      lastPosterDataUrl = "";
      trajLine.visible = isAi;
    }

    function triggerExplosion(reasonMain, reasonSub) {
      state = "crashed";
      throttle = 0;
      updateThrusterSound(0);
      playCrashBoom();
      rocketGroup.visible = false;
      flameGroup.visible = false;
      engineLight.intensity = 22;
      engineLight.position.set(x, 6, 4);
      shakeAmt = 3.8;

      const pl = PLANETS[planetIdx] || PLANETS[0];
      const pname = pl.shortName || "地球";
      let crashLossSuffix = "";
      if (controlMode === "human" && window._autoLoop) {
        const nCrash = incCrashCount();
        updateBestBadge();
        crashLossSuffix = ` · 已累计炸毁 ${nCrash} 艘船（亏掉 ${(nCrash * 3.2).toFixed(1)} 亿元！）`;
      }
      lastResultMeta = { ok: false, fuel: Math.round(fuel), spd: Math.abs(vy).toFixed(1), grade: "坠毁", planet: pname, mode: controlMode };

      // 电影级层次化体积大爆炸: 滚滚浓黑油烟包覆炽红橙火焰 (拒绝过曝纯白灯泡感!) + 飞溅亮白火花!
      for (let i = 0; i < 42; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = 4 + Math.random() * 14;
        spawnVolParticle(
          x + (Math.random() - 0.5) * 4.5, Math.max(3.5, y + 3.0), (Math.random() - 0.5) * 4.5,
          Math.cos(a) * spd, 5 + Math.random() * 14, Math.sin(a) * spd,
          "darksmoke", 2.2 + Math.random() * 1.4, 5.2 + Math.random() * 4.5, 1.55, -2.2
        );
      }
      for (let i = 0; i < 52; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = 3 + Math.random() * 17;
        spawnVolParticle(
          x + (Math.random() - 0.5) * 4.5, Math.max(2.8, y + 2.0), (Math.random() - 0.5) * 4.5,
          Math.cos(a) * spd, 4 + Math.random() * 16, Math.sin(a) * spd,
          "fire", 1.2 + Math.random() * 0.7, 5.4 + Math.random() * 4.6, 1.45, -1.5
        );
      }
      for (let i = 0; i < 90; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = 12 + Math.random() * 34;
        spawnVolParticle(
          x, Math.max(3.0, y + 2), 0,
          Math.cos(a) * spd, 8 + Math.random() * 24, Math.sin(a) * spd,
          "spark", 0.9 + Math.random() * 1.0, 1.1 + Math.random() * 0.9, 0.7, 16.0
        );
      }

      const b = document.getElementById("result-banner");
      document.getElementById("res-main").textContent = reasonMain;
      const bw = document.getElementById("beat-ai-wrap");
      if (bw) bw.innerHTML = "";
      document.getElementById("res-sub").textContent = reasonSub + crashLossSuffix;
      b.className = "result-banner crash show";
      buzz([40, 30, 90]);
      if (window._autoLoop) setTimeout(captureScorePoster, 220);
    }

      // 触地向四周翻滚铺开的柔和白蒸汽环 + 绚丽胜利火花
      for (let i = 0; i < 36; i++) {
        const a = (i / 36) * Math.PI * 2;
        spawnVolParticle(
          x + Math.cos(a) * 2.5, 2.8, Math.sin(a) * 2.5,

          "smoke", 1.5 + Math.random() * 0.8, 3.6, 1.8, -0.5
        );
      }
      for (let i = 0; i < 90; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = 5 + Math.random() * 15;
        spawnVolParticle(
          x + (Math.random() - 0.5) * 4, 8 + Math.random() * 8, (Math.random() - 0.5) * 4,
          Math.cos(a) * spd, 10 + Math.random() * 15, Math.sin(a) * spd,
          "confetti", 1.8 + Math.random() * 1.1, 1.6 + Math.random() * 0.9, 0.85, 9.0
        );
      }
      const b = document.getElementById("result-banner");
      const beatAi = (controlMode === "human" && fuelPct >= 60);
      document.getElementById("res-main").textContent = `🏆 回收成功 · 剩油 ${fuelPct}% (${grade})`;
      const bw = document.getElementById("beat-ai-wrap");
      if (bw) {
        bw.innerHTML = beatAi ? '<span class="beat-ai-tag">🏅 击败AI飞控大师认证（剩油 ≥ 60%）· 快去B站评论区晒图封神！</span>' : "";
      }
      document.getElementById("res-sub").textContent = (isNewRec ? "🎉 刷新个人最佳纪录！" : "") + ` 触地降速 ${Math.abs(vy).toFixed(1)} m/s · 精准命中${pname}靶心！`;
      b.className = "result-banner win show";
      buzz([25, 40, 35]);
      if (window._autoLoop) setTimeout(captureScorePoster, 220);
    }

    function stepPhysics(dt) {
      simTime += dt;
      const pl = PLANETS[planetIdx];
      skyUniforms.uTime.value = simTime;
      oceanUniforms.uTime.value = simTime;
      flameShaderMat.uniforms.uTime.value = simTime;

      if (pl.isOcean) {
        const ws = pl.waveScale || 1.0;
        shipGroup.position.y = Math.sin(simTime * (1.8 * (ws > 1.5 ? 1.35 : 1.0))) * (0.25 * ws);
        shipGroup.rotation.z = Math.sin(simTime * (1.3 * (ws > 1.5 ? 1.45 : 1.0))) * (0.022 * ws);
      } else {
        shipGroup.position.y = -0.35;
        shipGroup.rotation.z = 0;
        if (planetIdx === 1) earthInSky.rotation.y = simTime * 0.08;
      }

      const deckY = 2.35;
      const alt = Math.max(0, y - deckY);

      if (hoverShowcaseMode) {
        y = 44 + Math.sin(simTime * 2.1) * 2.0;
        x = Math.sin(simTime * 0.85) * 3.0;
        vy = -2.4;
        fuel = 88;
        angle = Math.sin(simTime * 1.0) * 0.05;
        legDeploy = 0.55 + Math.sin(simTime * 1.5) * 0.35;
        legs.forEach(p => { p.rotation.z = -legDeploy * 2.05; });
        rocketGroup.visible = true;
        rocketGroup.position.set(x, y, 0);
        rocketGroup.rotation.z = angle;
        flameGroup.visible = true;
        flameGroup.scale.set(1.0, 0.95 + Math.random() * 0.2, 1.0);
        nozzleMat.emissive.setHex(0x9a3412);
        engineLight.intensity = 9.0;
        engineLight.position.set(x, y - 5, 4);
        spawnVolParticle(
          x + (Math.random() - 0.5) * 1.2, y - 4.0, (Math.random() - 0.5) * 1.2,
          (Math.random() - 0.5) * 3, -15, (Math.random() - 0.5) * 3,
          "smoke", 0.9, 3.2, 1.85, -1.0
        );
      } else if (state === "flying") {
        let targetAngle = angle;
        const maxAccel = pl.g * 3.2;

        if (controlMode === "ai") {
          const windAcc = Math.sin(simTime * 0.7) * pl.wind * 0.35;
          const reqAx = (-x * 0.48 - vx * 1.45) - windAcc;
          targetAngle = Math.max(-0.32, Math.min(0.32, -reqAx / maxAccel));
          angle += (targetAngle - angle) * Math.min(1, dt * 8.0);

          const netBrake = Math.max(6.0, maxAccel * Math.cos(angle) - pl.g);
          const stopDist = (vy * vy) / (2 * netBrake);
          if (alt <= stopDist * 1.85 + 22.0 || alt < 38) {
            const desiredVy = alt > 14
              ? -Math.min(18.0, Math.sqrt(Math.max(4.0, alt * 0.52 * netBrake)))
              : -Math.max(1.4, alt * 0.18);
            const errVy = desiredVy - vy;
            throttle = Math.max(0.0, Math.min(1.0, (pl.g + errVy * 3.4) / (maxAccel * Math.cos(angle))));
          } else if (Math.abs(x) > 5 && alt > 45) {
            throttle = 0.25;
          } else {
            throttle = 0.0;
          }
        } else if (controlMode === "demo_crash_fast") {
          angle += (-0.20 - angle) * dt * 2.0;
          throttle = alt < 18 ? 1.0 : 0.0;
        } else if (controlMode === "demo_out_of_fuel") {
          angle += (0.06 - angle) * dt * 2.0;
          throttle = fuel > 0 ? 0.78 : 0.0;
        } else {
          throttle = humanThrust;
          angle += humanTurn * 1.15 * dt;
          angle = Math.max(-0.65, Math.min(0.65, angle));
        }

        if (fuel <= 0) { fuel = 0; throttle = 0; }

        const windAcc = Math.sin(simTime * 0.7) * pl.wind * 0.35;
        const thrustAcc = throttle * maxAccel;
        const ax = -Math.sin(angle) * thrustAcc + windAcc;
        const ay = Math.cos(angle) * thrustAcc - pl.g;

        vx += ax * dt;
        vy += ay * dt;
        x += vx * dt;
        y += vy * dt;

        if (throttle > 0.01) fuel = Math.max(0, fuel - throttle * 8.8 * dt);

        const targetLeg = alt < 45 ? 1.0 : 0.0;
        legDeploy += (targetLeg - legDeploy) * Math.min(1, dt * 3.8);
        legs.forEach(p => { p.rotation.z = -legDeploy * 2.05; });

        rocketGroup.position.set(x, y, 0);
        rocketGroup.rotation.z = angle;

        if (throttle > 0.05) {
          updateThrusterSound(throttle);
          flameGroup.visible = true;
          const flick = 0.88 + Math.random() * 0.28;
          flameGroup.scale.set(0.82 + throttle * 0.36, throttle * flick * 1.25, 0.82 + throttle * 0.36);
          nozzleMat.emissive.setHex(0x9a3412);
          engineLight.intensity = throttle * 11.0;
          engineLight.position.set(x, Math.max(3, y - 5), 4);

          // 柔光体积尾焰与低空翻涌白蒸汽浪
          for (let k = 0; k < 2; k++) {
            const sx = x + Math.sin(angle) * 3.6 + (Math.random() - 0.5) * 1.1;
            const sy = y - Math.cos(angle) * 3.6;
            spawnVolParticle(
              sx, sy, (Math.random() - 0.5) * 1.2,
              vx + Math.sin(angle) * 16 + (Math.random() - 0.5) * 5,
              vy - Math.cos(angle) * 20,
              (Math.random() - 0.5) * 5,
              alt < 22 ? "smoke" : (k === 0 ? "fire" : "smoke"),
              0.75 + Math.random() * 0.45,
              2.6 + throttle * 2.2,
              1.95,
              -1.2
            );
          }
        } else {
          updateThrusterSound(0);
          flameGroup.visible = false;
          nozzleMat.emissive.setHex(0x000000);
          engineLight.intensity *= 0.82;
        }

        if (trajLine.visible) {
          const tArr = trajGeo.attributes.position;
          let px = x, py = y, pvx = vx, pvy = vy;
          for (let i = 0; i < 36; i++) {
            tArr.setXYZ(i, px, Math.max(deckY + 0.5, py), 0);
            const tStep = 0.20;
            px += pvx * tStep;
            py += pvy * tStep;
            pvy -= pl.g * 0.35 * tStep;
            pvx *= 0.96;
          }
          tArr.needsUpdate = true;
        }

        const onDeck = Math.abs(x) <= 13.0;
        if (onDeck && y <= deckY + 0.2) {
          y = deckY + 0.1;
          rocketGroup.position.set(x, y, 0);
          const impactSpd = Math.abs(vy);
          const deg = Math.abs(angle * 180 / Math.PI);
          if (impactSpd <= 4.8 && deg <= 14.0) {
            angle = 0;
            rocketGroup.rotation.z = 0;
            triggerSuccess();
          } else {
            triggerExplosion(
              `降速 ${impactSpd.toFixed(1)} m/s · 炸船失败！`,
              deg > 14 ? `机身倾斜 ${deg.toFixed(0)}° 倾覆爆炸！` : `触地过猛(需 ≤ 4.5 m/s)，回收船直接报废！`
            );
          }
        } else if (!onDeck && y <= 0.6) {
          const isOcean = !!pl.isOcean;
          triggerExplosion(
            fuel <= 0.5 ? (isOcean ? "燃料耗尽 · 坠海喂鱼！" : "燃料耗尽 · 坠毁地表！") : (isOcean ? "偏离海上甲板 · 坠海炸毁！" : "偏离着陆坪 · 砸进陨石坑！"),
            fuel <= 0.5 ? "高空开油门太早，半空直接熄火！" : `落点偏离靶心 ${Math.abs(x).toFixed(0)} 米！`
          );
        }
      }

      // 更新柔光体积烟雾、火焰与火花粒子
      parts.forEach(p => {
        if (p.life > 0) {
          p.life -= dt;
          const sp = p.sprite;
          sp.position.x += p.vx * dt;
          sp.position.y += p.vy * dt;
          sp.position.z += p.vz * dt;
          p.vy -= p.grav * dt;
          if (sp.position.y < 2.2 && p.vy < 0) {
            sp.position.y = 2.2;
            p.vy *= -0.15;
            p.vx *= 1.18;
            p.vz *= 1.18;
          }
          const frac = Math.max(0, p.life / p.maxLife);
          sp.material.opacity = frac * frac * p.initOp;
          const curS = sp.scale.x * (1 + (p.grow - 1) * dt * 1.9);
          sp.scale.set(curS, curS, 1);
          if (p.life <= 0) sp.visible = false;
        }
      });

      // 电影机位追随
      shakeAmt *= 0.86;
      const sx = (Math.random() - 0.5) * shakeAmt;
      const sy = (Math.random() - 0.5) * shakeAmt;
      if (heroOrbitMode) {
        const ang = simTime * 0.55;
        camera.position.set(Math.sin(ang) * 44, 21 + Math.sin(simTime * 0.7) * 3, Math.cos(ang) * 44);
        camera.lookAt(0, 10, 0);
      } else if (hoverShowcaseMode) {
        const ang = Math.sin(simTime * 0.55) * 0.42;
        camera.position.set(Math.sin(ang) * 76, 36, Math.cos(ang) * 76);
        camera.lookAt(0, 30, 0);
      } else {
        const targetCamX = x * 0.55 + Math.sin(simTime * 0.35) * 6 + sx;
        const targetCamY = Math.max(20, y * 0.75 + 16) + sy;
        const targetCamZ = Math.max(54, Math.min(144, alt * 0.85 + 56));
        camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), 0.14);
        camera.lookAt(x * 0.55, Math.max(8, y * 0.72 + 5), 0);
      }

      document.getElementById("g-alt").textContent = `${Math.round(alt)} m`;
      const spdVal = Math.abs(vy);
      const spdEl = document.getElementById("g-spd");
      spdEl.textContent = `${spdVal.toFixed(1)} m/s`;
      spdEl.className = "gauge-val " + (spdVal <= 4.5 ? "val-safe" : (spdVal <= 10 ? "val-warn" : "val-danger"));
      const fuelEl = document.getElementById("g-fuel");
      fuelEl.textContent = `${Math.round(fuel)}%`;
      fuelEl.className = "gauge-val " + (fuel >= 30 ? "val-safe" : (fuel >= 12 ? "val-warn" : "val-danger"));

      renderer.render(scene, camera);
    }

    function ensureHumanTakeover() {
      ensureAudio();
      if (controlMode !== "human" || state !== "flying") {
        startRun("human");
      }
    }
    function setHumanThrust(v) {
      if (v) { ensureHumanTakeover(); buzz(12); }
      humanThrust = v;
      const bf = document.getElementById("btn-fire");
      if (bf) bf.classList.toggle("pressed", !!v);
    }
    function setHumanTurn(v) {
      if (v) ensureHumanTakeover();
      humanTurn = v;
      const bl = document.getElementById("btn-left");
      const br = document.getElementById("btn-right");
      if (bl) bl.classList.toggle("pressed", v > 0);
      if (br) br.classList.toggle("pressed", v < 0);
    }
    function setBarVisible(show) {
      document.getElementById("controls-bar").style.display = show ? "flex" : "none";
      const ra = document.getElementById("result-actions");
      if (ra) ra.style.display = show ? "flex" : "none";
      const spw = document.getElementById("score-poster-wrap");
      if (spw && !show) spw.style.display = "none";
      const bl = document.getElementById("bili-float-link");
      if (bl) bl.style.display = show ? "inline-flex" : "none";
      const ht = document.querySelector(".hud-top");
      if (ht) ht.style.display = show ? "flex" : "none";
    }
    function setHoverShowcase(on) {
      hoverShowcaseMode = !!on;
      heroOrbitMode = false;
      if (on) {
        state = "flying";
        rocketGroup.visible = true;
        trajLine.visible = false;
        document.getElementById("result-banner").classList.remove("show", "crash", "win");
        document.getElementById("mode-pill").className = "mode-pill";
        document.getElementById("mode-pill").textContent = "3D 海上火箭回收 · 规则演示";
      }
    }
    function setHeroOrbit(on) { heroOrbitMode = !!on; hoverShowcaseMode = false; }
    function getSimState() { return { state, alt: Math.max(0, y - 2.35), vy, fuel, x, y }; }
    function setOutOfFuelTarget() { x = 18.5; y = 92; vx = 1.6; vy = -5.5; angle = 0.08; fuel = 26.0; }
    function setCrashFastTarget() { x = -4.5; y = 112; vx = 1.1; vy = -12.0; angle = -0.10; fuel = 100.0; }

    function bindHoldButton(elId, onDown, onUp) {
      const el = document.getElementById(elId);
      if (!el) return;
      el.addEventListener("pointerdown", e => {
        e.preventDefault();
        if (el.setPointerCapture) { try { el.setPointerCapture(e.pointerId); } catch (err) {} }
        onDown();
      });
      ["pointerup", "pointercancel", "lostpointercapture"].forEach(evt => {
        el.addEventListener(evt, e => { e.preventDefault(); onUp(); });
      });
    }
    bindHoldButton("btn-fire", () => setHumanThrust(1), () => setHumanThrust(0));
    bindHoldButton("btn-left", () => setHumanTurn(1), () => setHumanTurn(0));
    bindHoldButton("btn-right", () => setHumanTurn(-1), () => setHumanTurn(0));

    window.addEventListener("keydown", e => {
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); setHumanThrust(1); }
      if (e.code === "ArrowLeft" || e.code === "KeyA") { e.preventDefault(); setHumanTurn(1); }
      if (e.code === "ArrowRight" || e.code === "KeyD") { e.preventDefault(); setHumanTurn(-1); }
      if (e.code === "KeyI") startRun(controlMode === "ai" ? "human" : "ai");
      if (e.code === "KeyR") { ensureAudio(); startRun("human"); }
      if (e.code === "KeyG") { ensureAudio(); cyclePlanet(); }
      if (e.code === "KeyM") toggleAudio();
    });
    window.addEventListener("keyup", e => {
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") setHumanThrust(0);
      if (e.code === "ArrowLeft" || e.code === "KeyA" || e.code === "ArrowRight" || e.code === "KeyD") setHumanTurn(0);
    });
    window.addEventListener("blur", () => { setHumanThrust(0); setHumanTurn(0); });
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.stepPhysics = stepPhysics;
    window.startRun = startRun;
    window.cyclePlanet = cyclePlanet;
    window.setHumanThrust = setHumanThrust;
    window.setHumanTurn = setHumanTurn;
    window.setBarVisible = setBarVisible;
    window.setHoverShowcase = setHoverShowcase;
    window.setHeroOrbit = setHeroOrbit;
    window.getSimState = getSimState;
    window.setOutOfFuelTarget = setOutOfFuelTarget;
    window.setCrashFastTarget = setCrashFastTarget;
    window.toggleAudio = toggleAudio;
    window.copyShareScore = copyShareScore;
    window.shareToBilibili = shareToBilibili;
    window.copyScoreImage = copyScoreImage;
    window.downloadScorePoster = downloadScorePoster;
    window.captureScorePoster = captureScorePoster;
    window.openChallengeModal = openChallengeModal;
    window.closeChallengeModal = closeChallengeModal;
    window.applyChallengeCode = applyChallengeCode;
    window.copyChallengeForBilibili = copyChallengeForBilibili;

    window._autoLoop = true;
    let lastT = performance.now();
    function rafLoop(now) {
      if (window._autoLoop) {
        const dt = Math.min(0.033, (now - lastT) / 1000);
        lastT = now;
        stepPhysics(dt);
      }
      requestAnimationFrame(rafLoop);
    }
    applyPlanetTheme();
    try {
      const params = new URLSearchParams(location.search);
      const urlCode = params.get("c");
      if (urlCode && applyChallengeCode(urlCode, true)) {
        // 已直接载入自定义挑战码并开始手操
      } else {
        startRun("ai");
      }
    } catch (e) {
      startRun("ai");
    }
    requestAnimationFrame(rafLoop);
    const splash = document.getElementById("boot-splash");
    if (splash) {
      splash.classList.add("hide");
      setTimeout(() => { splash.style.display = "none"; }, 320);
    }
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
